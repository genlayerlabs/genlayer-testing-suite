name: Generate API Docs and PR to genlayer-docs

# Called by publish.yml after a stable release is published (releases created
# with GITHUB_TOKEN do not trigger `release` workflows), or run manually.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to generate the reference from (default: selected ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to generate the reference from
        required: true
        type: string

jobs:
  generate-and-sync:
    # When called from publish.yml the package and release are already out, so a
    # docs failure must not fail the release run (the failing steps stay visible
    # in this job; re-run sync-docs.yml manually). Manual dispatch still fails.
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: Sync-docs
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e .

      - name: Determine version
        id: version
        env:
          INPUT_REF: ${{ inputs.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            case "$INPUT_REF" in
              *$'\n'*|*$'\r'*) echo "Invalid ref" >&2; exit 1 ;;
            esac
            VALUE="$INPUT_REF"
          elif [ "$REF_TYPE" = "tag" ]; then
            VALUE="$REF_NAME"
          else
            VALUE="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Generate API docs
        run: python scripts/generate-api-docs.py

      - name: Generate docs repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_KEY }}
          repositories: genlayer-docs

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: genlayerlabs/genlayer-docs
          token: ${{ steps.app-token.outputs.token }}
          path: docs-repo
          fetch-depth: 0

      - name: Sync and push docs
        working-directory: docs-repo
        env:
          DOCS_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_DOCS: ${{ github.workspace }}/docs/api-references
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf pages/api-references/genlayer-test
          mkdir -p pages/api-references/genlayer-test
          cp "$SOURCE_DOCS/index.md" pages/api-references/genlayer-test.md
          cp "$SOURCE_DOCS/integration.md" pages/api-references/genlayer-test/integration.md
          cp "$SOURCE_DOCS/direct.md" pages/api-references/genlayer-test/direct.md
          cp "$SOURCE_DOCS/glsim.md" pages/api-references/genlayer-test/glsim.md
          echo '{"integration": "Integration Testing", "direct": "Direct Mode", "glsim": "glsim"}' > pages/api-references/genlayer-test/_meta.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add pages/api-references/genlayer-test pages/api-references/genlayer-test.md
          git commit -m "docs(test): sync API reference $DOCS_VERSION"
          git push
